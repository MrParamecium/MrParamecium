name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&title_color=3B82A0&icon_color=3B82A0&text_color=57606a
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light top-languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=transparent&hide_border=true&title_color=3B82A0&text_color=57606a
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark top-languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=transparent&hide_border=true&title_color=58A6FF&text_color=C9D1D9
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate theme-aware streak cards
        run: |
          mkdir -p profile
          curl -fsSL --retry 3 "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=transparent&hide_border=true&ring=3B82A0&fire=3B82A0&currStreakLabel=3B82A0&sideNums=57606a&currStreakNum=57606a&sideLabels=57606a&dates=8c959f" -o profile/streak-light.svg
          curl -fsSL --retry 3 "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=transparent&hide_border=true&ring=58A6FF&fire=58A6FF&currStreakLabel=58A6FF&sideNums=C9D1D9&currStreakNum=C9D1D9&sideLabels=C9D1D9&dates=8B949E" -o profile/streak-dark.svg
          python - <<'PY'
          from pathlib import Path

          accessibility = (
              " role='img' aria-labelledby='streak-title streak-desc'>\n"
              "<title id='streak-title'>MrParamecium GitHub contribution streak</title>\n"
              "<desc id='streak-desc'>Contribution totals, current streak, and longest streak for MrParamecium.</desc>"
          )
          for path in (Path("profile/streak-light.svg"), Path("profile/streak-dark.svg")):
              svg = path.read_text(encoding="utf-8")
              svg = svg.replace(" direction='ltr'>", f" direction='ltr'{accessibility}", 1)
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Validate generated cards
        run: |
          for card in profile/*.svg; do
            test -s "$card"
            grep -q '<svg' "$card"
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stats cards" || exit 0
          git push
